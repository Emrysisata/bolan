<!DOCTYPE html>
<html>
<head>

            #topDiv > h1 {

            }
            #topDiv > button {

                font-size: 1em;
            }

            #appTradingParametersDiv {

            }
            #appTradingParametersDiv > div {
                flex-direction: row;
                width: auto;

            }
            .parameterEditValTools > input {

                font-size: 1em;
            }

            }
            #dexesLocation > div {

                margin-bottom: 20px;
                font-size: 0.9em;
            }

            }

                font-size: 1em;
            }
            #buySellInformationHolderDiv > div {

            }
            #appTradingParametersDiv {

                margin-top: 20px;
            }
            #tradeStartStop {
                width: 80px;
                height: 80px;
                font-size: 1.2em;
                bottom: 20px;
            }
            #logMessages {
                font-size: 0.9em;
                margin-top: 10px;
            }
        }

        const DEFAULT_PUBLIC_KEY = 'xxxxxxxxxxxxxxxxxx';

            Dex3: { sol: 200, usdc: 15000, usdcToSolPrice: 102, name: "Dex3" },

            dex1UsdcElement = document.getElementById("dex1usdc");
            dex2SolElement = document.getElementById("dex2sol");
            dex2UsdcElement = document.getElementById("dex2usdc");
            dex3SolElement = document.getElementById("dex3sol");
            dex3UsdcElement = document.getElementById("dex3usdc");
            buyInfoDiv = document.getElementById("tradeSimulationResultHolderDiv1");
            sellInfoDiv = document.getElementById("tradeSimulationResultHolderDiv2");
            profitInfoDiv = document.getElementById("tradeSimulationResultHolderDiv3");
            pubKeyDisplay = document.querySelector("#enteredAccountInfo i:nth-child(2)");
        }

        function updateDateTime() {
            const now = new Date();
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            currentDateOfOperationElement.textContent = now.toLocaleDateString(undefined, dateOptions);
            currentTimeOfOperationElement.textContent = now.toLocaleTimeString(undefined, timeOptions);
        }

        function logMessage(message) {
            const now = new Date();
            const time = now.toLocaleTimeString();
            logMessagesElement.textContent += `[${time}] ${message}\n`;
            logMessagesElement.scrollTop = logMessagesElement.scrollHeight;
        }

                if (decoded.length === 64) {

                    logMessage(`Private key loaded. Public Key: ${walletPublicKey.toBase58()}`);
                    pubKeyDisplay.textContent = `PUB:${walletPublicKey.toBase58().substring(0, 10)}...`;
                    await fetchWalletBalances(); // Fetch balances after key is loaded
                } else {

                    walletPrivateKey = null;

                    pubKeyDisplay.textContent = `PUB:${DEFAULT_PUBLIC_KEY}`;

            } catch (error) {

                walletPrivateKey = null;
                walletPublicKey = null;
                pubKeyDisplay.textContent = `PUB:${DEFAULT_PUBLIC_KEY}`;
            }
        }

        async function fetchWalletBalances() {
            if (!walletPublicKey) {
                logMessage("Wallet public key not loaded. Please load the private key first.");
                return;
            }

            try {
                solBalance = await connection.getBalance(walletPublicKey);
                logMessage(`SOL Balance: ${solBalance / solanaWeb3.LAMPORTS_PER_SOL} SOL`);

                // Mock USDC balance (replace with actual token balance fetch)
                usdcBalance = Math.random() * 10000; // Mock value
                logMessage(`USDC Balance: ${usdcBalance.toFixed(2)} USDC`);

                updateAccountInfoDisplay();
            } catch (error) {
                logMessage(`Error fetching balances: ${error.message}`);
            }
        }

        function updateAccountInfoDisplay() {
            document.querySelector("#enteredAccountInfo i:nth-child(1)").textContent = `SOL: ${(solBalance / solanaWeb3.LAMPORTS_PER_SOL).toFixed(4)}`;
            document.querySelector("#enteredAccountInfo i:nth-child(3)").textContent = `USDC: ${usdcBalance.toFixed(2)}`;
        }

            logMessage("Fetching price data for Dex3...");

        /**
         * Simulates the process of finding the most profitable arbitrage opportunity
         * among the available DEXs.
         *
         * @returns {Promise<{ buyDex: {name: string, usdcToSolPrice: number},
         * sellDex: {name: string, usdcToSolPrice: number},
         * profit: number } | null>}
         * A promise that resolves to an object containing the buy DEX, sell DEX,
         * and potential profit, or null if no profitable trade is found.
         */
        async function simulateHighestProfitScenario() {
            logMessage("Simulating highest profit scenario...");

            // Fetch price data from all DEXs concurrently
            const [dex1Data, dex2Data, dex3Data] = await Promise.all([
                dex1PriceDataRead(),
                dex2PriceDataRead(),
                dex3PriceDataRead(),
            ]);

            // Array of DEX data for easier manipulation
            const dexArray = [dex1Data, dex2Data, dex3Data];

            let bestBuyDex = null;
            let bestSellDex = null;
            let potentialProfit = 0;

            // Find the DEX with the lowest price (best for buying)
            bestBuyDex = dexArray.reduce((minDex, currentDex) =>
                currentDex.usdcToSolPrice < minDex.usdcToSolPrice ? currentDex : minDex, dexArray[0]
            );

            // Find the DEX with the highest price (best for selling), excluding the bestBuyDex
            bestSellDex = dexArray.reduce((maxDex, currentDex) => {
                if (currentDex.dexName !== bestBuyDex.dexName && currentDex.usdcToSolPrice > maxDex.usdcToSolPrice) {
                    return currentDex;
                }
                return maxDex;
            }, dexArray.find(dex => dex.dexName !== bestBuyDex.dexName) || dexArray[0]); //handles edge case

            // Calculate potential profit
            potentialProfit = bestSellDex.usdcToSolPrice - bestBuyDex.usdcToSolPrice;

            // Get user-defined constraints
            const maxLoss = parseFloat(maxLossInput.value) || 0;
            const minGain = parseFloat(minGainInput.value) || 0;

            // Check if the potential profit meets the criteria
            if (potentialProfit > minGain && potentialProfit < maxLoss) {
                logMessage(
                    `Potential profit found: ${potentialProfit.toFixed(2)} SOL. Buying from ${bestBuyDex.dexName}, selling on ${bestSellDex.dexName}`
                );
                return {
                    buyDex: bestBuyDex,
                    sellDex: bestSellDex,
                    profit: potentialProfit,
                };
            } else {
                logMessage(
                    `No profitable trade found within constraints. Profit: ${potentialProfit.toFixed(2)}, Max Loss: ${maxLoss}, Min Gain: ${minGain}`
                );
                return null;
            }
